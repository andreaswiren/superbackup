[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.8.0"
edition = "2021"
# What the dependency tree actually needs, not an aspiration.
#
# This said 1.82 while `notify-rust` required 1.89 and `globset` and the `icu`
# crates required 1.88 - so `cargo check` on the minimum toolchain failed to
# even resolve, and the CI job that exists to catch exactly that had been red
# for its whole recorded history. A version nobody can build with is worse
# than no claim at all.
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/andreaswiren/superbackup"
authors = ["Andreas Wiren"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
zeroize = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
