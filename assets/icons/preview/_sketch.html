<!doctype html><meta charset="utf-8">
<style>
 body{background:#0c0e12;color:#E8ECF2;font:13px/1.4 system-ui,sans-serif;margin:0;padding:20px}
 .row{display:flex;align-items:flex-end;gap:22px;margin:0 0 26px;padding:0 0 20px;border-bottom:1px solid #262b34}
 .lab{width:120px;font-weight:600}
 .cell{display:flex;flex-direction:column;align-items:center;gap:5px;color:#8A94A1;font-size:10px}
 .lt{background:#F3F3F3;padding:6px;border-radius:4px}
 .dk{background:#202020;padding:6px;border-radius:4px}
 h2{font:600 14px system-ui;color:#8A94A1;margin:24px 0 10px}
</style>
<body>
<div id="out"></div>
<script>
const INK="#E8ECF2", ACC="#5B9BFF", DIM="#6C7embed";
const ink="#E8ECF2", acc="#5B9BFF", dim="#77808F";

// each mark: function(id) -> svg inner markup on 64x64 grid
const marks = {

"A cascade": id=>`
 <defs><mask id="mA${id}">
   <rect width="64" height="64" fill="#fff"/>
   <rect x="24.4" y="24.4" width="27.2" height="27.2" rx="7.6" fill="#000"/>
 </mask>
 <mask id="mA2${id}">
   <rect width="64" height="64" fill="#fff"/>
   <rect x="16.4" y="16.4" width="27.2" height="27.2" rx="7.6" fill="#000"/>
   <rect x="24.4" y="24.4" width="27.2" height="27.2" rx="7.6" fill="#000"/>
 </mask></defs>
 <g mask="url(#mA2${id})"><rect x="10.6" y="10.6" width="24" height="24" rx="6" fill="none" stroke="${dim}" stroke-width="3.2"/></g>
 <g mask="url(#mA${id})"><rect x="18.6" y="18.6" width="24" height="24" rx="6" fill="none" stroke="${ink}" stroke-width="3.2"/></g>
 <rect x="26.6" y="26.6" width="24" height="24" rx="6" fill="${acc}"/>`,

"B condenser": id=>`
 <g fill="${dim}">
  <rect x="8" y="8" width="6" height="6" rx="1.6"/><rect x="17" y="8" width="6" height="6" rx="1.6"/><rect x="26" y="8" width="6" height="6" rx="1.6"/>
  <rect x="8" y="17" width="6" height="6" rx="1.6"/><rect x="17" y="17" width="6" height="6" rx="1.6"/><rect x="26" y="17" width="6" height="6" rx="1.6"/>
  <rect x="8" y="26" width="6" height="6" rx="1.6"/><rect x="17" y="26" width="6" height="6" rx="1.6"/>
 </g>
 <rect x="28" y="28" width="28" height="28" rx="7" fill="${acc}"/>`,

"D dedup pair": id=>`
 <defs><clipPath id="cD${id}"><rect x="26" y="26" width="30" height="30" rx="7.5"/></clipPath></defs>
 <rect x="8" y="8" width="30" height="30" rx="7.5" fill="none" stroke="${ink}" stroke-width="3.2"/>
 <g clip-path="url(#cD${id})"><rect x="8" y="8" width="30" height="30" rx="7.5" fill="${acc}"/></g>
 <rect x="26" y="26" width="30" height="30" rx="7.5" fill="none" stroke="${ink}" stroke-width="3.2"/>`,

"G ziggurat": id=>`
 <rect x="12" y="42" width="40" height="10" rx="5" fill="${dim}"/>
 <rect x="16" y="29" width="32" height="10" rx="5" fill="${ink}"/>
 <rect x="20" y="16" width="24" height="10" rx="5" fill="${acc}"/>`,

"I chunk column": id=>`
 <rect x="19" y="9"  width="26" height="13" rx="6" fill="${dim}"/>
 <rect x="19" y="25.5" width="26" height="13" rx="6" fill="${ink}"/>
 <rect x="19" y="42" width="26" height="13" rx="6" fill="${acc}"/>`,

"K folder copy": id=>`
 <path d="M8 20 v-4 a3 3 0 0 1 3-3 h8 l3.5 4.5 h12 a3 3 0 0 1 3 3 v3" fill="none" stroke="${dim}" stroke-width="3.2" stroke-linecap="round"/>
 <path d="M14 44 V26 a4 4 0 0 1 4-4 h10 l4 5 h16 a4 4 0 0 1 4 4 v13 a4 4 0 0 1 -4 4 z" fill="${ink}"/>
 <rect x="14" y="40" width="38" height="12" rx="4" fill="${acc}"/>`,

"M iso layers": id=>`
 <path d="M32 10 L54 22 L32 34 L10 22 Z" fill="${acc}"/>
 <path d="M10 32 L32 44 L54 32" fill="none" stroke="${ink}" stroke-width="3.4" stroke-linejoin="round"/>
 <path d="M10 42 L32 54 L54 42" fill="none" stroke="${dim}" stroke-width="3.4" stroke-linejoin="round"/>`,
};

function plate(inner, size, bg){
  return `<svg width="${size}" height="${size}" viewBox="0 0 64 64">
   <rect width="64" height="64" rx="14" fill="#181D26"/>${inner}</svg>`;
}
const sizes=[128,64,48,32,24,16];
let html="";
let i=0;
for (const [name,fn] of Object.entries(marks)){
  i++;
  const inner = fn(i);
  html += `<div class="row"><div class="lab">${name}</div>` +
    sizes.map(s=>`<div class="cell">${plate(inner,s)}<span>${s}</span></div>`).join("") +
    `<div class="cell"><div class="lt">${plate(inner,32)}</div><span>light</span></div>`+
    `<div class="cell"><div class="lt">${plate(inner,16)}</div><span>16 light</span></div>`+
    `</div>`;
}
document.getElementById("out").innerHTML = html;
</script>
