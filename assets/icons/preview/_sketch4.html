<!doctype html><meta charset="utf-8">
<style>
 body{background:#0c0e12;color:#E8ECF2;font:13px/1.4 system-ui,sans-serif;margin:0;padding:14px}
 .row{display:flex;align-items:center;gap:14px;margin:0 0 14px;padding:0 0 10px;border-bottom:1px solid #262b34}
 .lab{width:96px;font-weight:600;font-size:11px}
 .cell{display:flex;flex-direction:column;align-items:center;gap:3px;color:#8A94A1;font-size:9px}
 .lt{background:#F3F3F3;padding:5px;border-radius:4px}
 .ph{background:linear-gradient(120deg,#7a5c3a,#2e6b8a 40%,#b0483c 70%,#4a7a3f);padding:5px;border-radius:4px}
</style>
<body><div id="out"></div>
<script>
const ink="#E8ECF2", acc="#5B9BFF", accd="#2761D0", mid="#98A2B3";
const marks={
"R1 white+acc": id=>`
 <defs><mask id="a${id}"><rect width="64" height="64" fill="#fff"/><rect x="30" y="30" width="30" height="30" rx="10" fill="#000"/></mask></defs>
 <rect x="9" y="9" width="38" height="38" rx="10.5" fill="${ink}" mask="url(#a${id})"/>
 <rect x="34" y="34" width="21" height="21" rx="6.5" fill="${acc}"/>`,

"R2 acc+white": id=>`
 <defs><mask id="b${id}"><rect width="64" height="64" fill="#fff"/><rect x="30" y="30" width="30" height="30" rx="10" fill="#000"/></mask></defs>
 <rect x="9" y="9" width="38" height="38" rx="10.5" fill="${acc}" mask="url(#b${id})"/>
 <rect x="34" y="34" width="21" height="21" rx="6.5" fill="${ink}"/>`,

"R3 3step 2tone": id=>`
 <defs><mask id="c${id}"><rect width="64" height="64" fill="#fff"/>
   <rect x="25" y="25" width="34" height="34" rx="10" fill="#000"/><rect x="38" y="38" width="26" height="26" rx="9" fill="#000"/></mask>
  <mask id="c2${id}"><rect width="64" height="64" fill="#fff"/><rect x="38" y="38" width="26" height="26" rx="9" fill="#000"/></mask></defs>
 <rect x="6" y="6" width="36" height="36" rx="10" fill="${ink}" mask="url(#c${id})"/>
 <rect x="29" y="29" width="18" height="18" rx="5.5" fill="${ink}" mask="url(#c2${id})"/>
 <rect x="42" y="42" width="15" height="15" rx="4.6" fill="${acc}"/>`,

"R4 3step equal": id=>`
 <defs><mask id="d${id}"><rect width="64" height="64" fill="#fff"/>
   <rect x="21" y="21" width="34" height="34" rx="11" fill="#000"/><rect x="33" y="33" width="34" height="34" rx="11" fill="#000"/></mask>
  <mask id="d2${id}"><rect width="64" height="64" fill="#fff"/><rect x="33" y="33" width="34" height="34" rx="11" fill="#000"/></mask></defs>
 <rect x="5" y="5" width="30" height="30" rx="8.5" fill="${ink}" mask="url(#d${id})"/>
 <rect x="17" y="17" width="30" height="30" rx="8.5" fill="${mid}" mask="url(#d2${id})"/>
 <rect x="29" y="29" width="30" height="30" rx="8.5" fill="${acc}"/>`,

"R5 tabbed tile": id=>`
 <defs><mask id="e${id}"><rect width="64" height="64" fill="#fff"/><rect x="30" y="30" width="30" height="30" rx="10" fill="#000"/></mask></defs>
 <path d="M9 19.5 a5 5 0 0 1 5 -5 h8.5 l3 4.5 h16.5 a5 5 0 0 1 5 5 V47 H9 Z" fill="${ink}" mask="url(#e${id})"/>
 <rect x="34" y="34" width="21" height="21" rx="6.5" fill="${acc}"/>`,

"R6 wide kerf": id=>`
 <defs><mask id="f${id}"><rect width="64" height="64" fill="#fff"/><rect x="29" y="29" width="32" height="32" rx="11" fill="#000"/></mask></defs>
 <rect x="8" y="8" width="39" height="39" rx="11" fill="${ink}" mask="url(#f${id})"/>
 <rect x="34" y="34" width="22" height="22" rx="7" fill="${acc}"/>`,
};
function plate(inner,size,cls,filter){
 return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" ${filter?'style="filter:'+filter+'"':''}>
  <rect width="64" height="64" rx="14" fill="#1A202A"/>
  <rect x="0.6" y="0.6" width="62.8" height="62.8" rx="13.6" fill="none" stroke="#333C4B" stroke-width="1.2"/>${inner}</svg>`;}
const sizes=[128,48,32,24,20,16];
let html="",i=0;
for(const [n,fn] of Object.entries(marks)){i++;const inner=fn(i);
 html+=`<div class="row"><div class="lab">${n}</div>`+
  sizes.map(s=>`<div class="cell">${plate(inner,s)}<span>${s}</span></div>`).join("")+
  `<div class="cell"><div class="lt">${plate(inner,32)}</div><span>lt32</span></div>`+
  `<div class="cell"><div class="lt">${plate(inner,16)}</div><span>lt16</span></div>`+
  `<div class="cell"><div class="ph">${plate(inner,32)}</div><span>busy</span></div>`+
  `<div class="cell">${plate(inner,40,null,"grayscale(1)")}<span>grey</span></div>`+
  `<div class="cell">${plate(inner,40,null,"grayscale(1) contrast(0.6)")}<span>grey-</span></div></div>`;}
document.getElementById("out").innerHTML=html;
</script>
