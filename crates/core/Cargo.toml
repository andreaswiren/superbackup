[package]
name = "superbackup-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Core engine for superbackup: config, crypto vault, Kopia driver, scheduler, IPC."

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
chrono.workspace = true
uuid.workspace = true
directories.workspace = true
zeroize.workspace = true
argon2 = "0.5.3"
chacha20poly1305 = "0.10.1"
rand = "0.9.5"
hkdf = "0.12.4"
sha2 = "0.10.9"
subtle = "2.6.1"
base64 = "0.23.1"
hex = "0.4.3"
which = "8.0.6"
walkdir = "2.5.0"
globset = "0.4.19"
humantime = "2.4.0"
bytesize = "2.3.1"
interprocess = { version = "2.4.3", features = ["tokio"] }
notify = "8.2.0"
sysinfo = "0.36.1"
whoami = "2.1.3"
hostname = "0.4.2"
croner = "3.0.1"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
notify-rust = "4.17.0"
reqwest = { version = "0.13.3", default-features = false, features = ["charset", "http2", "json", "rustls", "stream"] }
semver = "1.0.28"
zip = { version = "5.0.1", default-features = false, features = ["deflate"] }
flate2 = "1.1.10"
tar = "0.4.46"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_Networking_NetworkListManager", "Win32_System_Com", "Win32_System_Power", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Threading"] }
windows-service = "0.8.1"
