name: Release

# Tagging `v0.1.0` builds every platform, checksums the artefacts, attests
# their provenance, and opens a **draft** release.
#
# The draft is deliberate. A backup tool's binary is a supply-chain artefact:
# once someone has downloaded it, an unpublish does not reach them. A human
# reads the notes and presses publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true
      platforms:
        description: "Which platforms to build"
        required: false
        default: windows
        type: choice
        options: [windows, all]

permissions:
  contents: write
  # Required by actions/attest-build-provenance to sign the attestation.
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Refuse to build a release that disagrees with itself before spending
  # twenty minutes of matrix time discovering it.
  # ---------------------------------------------------------------------------
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      changelog_version: ${{ steps.check.outputs.changelog_version }}
      targets: ${{ steps.platforms.outputs.targets }}
      test_os: ${{ steps.platforms.outputs.test_os }}
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: The tag, Cargo.toml and CHANGELOG must agree
        id: check
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          # A release candidate carries a prerelease suffix that Cargo.toml does
          # not: v0.1.0-rc.1 is still a build of 0.1.0. Compare the core version
          # so a test release does not require churning the manifest.
          base="${version%%-*}"
          manifest=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')

          if [ "$base" != "$manifest" ]; then
            echo "::error::tag $tag implies version $base, but Cargo.toml says $manifest"
            exit 1
          fi

          # A release whose changelog still says [Unreleased] tells a user
          # nothing about what they are installing.
          if ! grep -q "## \[$base\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$base]' section"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "changelog_version=$base" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (changelog section $base)"

      # Which platforms this release builds.
      #
      # Windows only by default, including for a tag push. Windows is the
      # stated priority platform and the one this is used on daily; building
      # the other five costs the wall clock of the slowest of them for
      # artefacts nobody is waiting on. Run the workflow by hand with
      # `platforms: all` for a full set.
      #
      # The other targets are not deleted, because "for now" is what this
      # is: they are one input away.
      - name: Choose the platforms
        id: platforms
        run: |
          set -euo pipefail
          want="${{ github.event.inputs.platforms || 'windows' }}"
          if [ "$want" = "all" ]; then
            targets='[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","binary":"superbackup.exe","archive":"zip"},{"os":"windows-11-arm","target":"aarch64-pc-windows-msvc","binary":"superbackup.exe","archive":"zip"},{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","binary":"superbackup","archive":"tar.gz"},{"os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu","binary":"superbackup","archive":"tar.gz"},{"os":"macos-latest","target":"aarch64-apple-darwin","binary":"superbackup","archive":"tar.gz"},{"os":"macos-latest","target":"x86_64-apple-darwin","binary":"superbackup","archive":"tar.gz"}]'
            test_os='["windows-latest","ubuntu-latest","macos-latest"]'
          else
            targets='[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","binary":"superbackup.exe","archive":"zip"}]'
            test_os='["windows-latest"]'
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "test_os=$test_os" >> "$GITHUB_OUTPUT"
          echo "platforms=$want" >> "$GITHUB_OUTPUT"
          echo "Building: $want"

      # A prebuilt binary, not `cargo install cargo-deny`, which compiles it
      # from source. Preflight gates every other job, so those minutes were
      # serial time on the front of every release for a check that takes
      # seconds to actually run.
      - name: The dependency policy must pass before anything is published
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # ---------------------------------------------------------------------------
  # Test
  # ---------------------------------------------------------------------------
  #
  # Once per operating system, beside the builds rather than in front of them.
  #
  # This used to run inside every build job: six full suites, and each build
  # therefore compiled the whole workspace twice — once in debug for the tests
  # and again in release for the artefact. The jobs run in parallel, so the
  # wall clock was one machine doing both halves back to back, and a release
  # took over half an hour.
  #
  # The suite is the same code on `x86_64` and `aarch64` of the same platform:
  # it exercises scheduling, parsing, crypto and IPC, none of which the
  # architecture changes. What the architecture changes is whether the thing
  # *builds*, and that is what the build jobs still prove, on all six.
  #
  # The guarantee is unchanged — a tag that does not pass does not ship —
  # because `draft` requires this to succeed before it publishes anything.
  # Gating the *publish* rather than the *compile* is what lets the two run at
  # the same time.
  test:
    name: test (${{ matrix.os }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.preflight.outputs.test_os) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GUI and tray dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev \n            libayatana-appindicator3-dev pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}

      # No `--target`: on the host triple it only moves the output into a
      # second directory and defeats the cache the build jobs share.
      - name: Test
        run: cargo test --workspace

  # ---------------------------------------------------------------------------
  # Build
  # ---------------------------------------------------------------------------
  build:
    name: build ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Built by `preflight`, so the set of platforms is one decision in one
        # place rather than a table here and a condition somewhere else.
        include: ${{ fromJSON(needs.preflight.outputs.targets) }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux GUI and tray dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev \
            libayatana-appindicator3-dev pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # No test step: the `test` job runs the suite once per platform, in
      # parallel with this. See the note above it.
      - name: Build
        run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.version }}"
          stem="superbackup-${version}-${{ matrix.target }}"
          mkdir -p "dist/$stem"

          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/$stem/"
          cp README.md CHANGELOG.md LICENSE "dist/$stem/"

          # Kopia is Apache-2.0 and is fetched at run time rather than bundled,
          # but the attribution travels with the binary regardless. See
          # docs/compliance/THIRD_PARTY.md.
          mkdir -p "dist/$stem/licenses"
          cp docs/compliance/THIRD_PARTY.md "dist/$stem/licenses/"

          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "$stem.zip" "$stem" >/dev/null
          else
            tar czf "$stem.tar.gz" "$stem"
          fi
          rm -rf "$stem"
          ls -la

      - name: Checksum
        shell: bash
        run: |
          cd dist
          for f in *.zip *.tar.gz; do
            [ -e "$f" ] || continue
            if command -v sha256sum >/dev/null; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done
          cat ./*.sha256

      # Signs a provenance statement tying these bytes to this workflow run and
      # this commit. It is the closest thing to a verifiable "we built this"
      # available without a code-signing certificate — and it is exactly the
      # guarantee superbackup itself cannot get from Kopia's releases, so it
      # would be poor form not to offer it downstream.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "dist/*.zip,dist/*.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Assemble the draft
  # ---------------------------------------------------------------------------
  draft:
    name: draft the release
    needs: [preflight, build, test]
    # Publish what built, rather than nothing.
    #
    # `needs` alone means one platform's failure cancels the release for all
    # of them, so a clippy lint on macOS held back a Windows build that had
    # already compiled, tested and packaged cleanly. The stated priority is
    # Windows first, Linux second, macOS third; a release missing the third
    # should say so, not fail to exist.
    #
    # Preflight stays absolute: it checks the tag against the manifest and the
    # changelog, and a release that disagrees with its own version number is
    # worse than no release. The collect step refuses to publish without a
    # Windows artefact, so this cannot quietly ship an empty one.
    # `always()` so a platform that failed to build does not cancel the
    # release for the ones that succeeded — but preflight and the tests are
    # absolute. A release whose version disagrees with its own manifest, or
    # one built from code that fails its suite, is worse than no release.
    if: always() && needs.preflight.result == 'success' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: incoming

      - name: Collect artefacts and build one checksum manifest
        run: |
          set -euo pipefail
          mkdir -p dist
          find incoming -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} dist/ \;

          # Windows is the priority platform. A release without it is not a
          # release, however many others built.
          if ! ls dist/*windows* >/dev/null 2>&1; then
            echo "::error::no Windows artefact was produced; refusing to publish"
            exit 1
          fi

          # Say plainly which platforms made it, so a missing one shows in the
          # log rather than only by counting files on the release page.
          echo "Publishing these artefacts:"
          ls -1 dist
          # Only the platforms this run was asked for. A Windows-only release
          # warning that Linux and macOS are absent is noise about a decision
          # somebody made deliberately.
          if [ "${{ needs.preflight.outputs.platforms }}" = "all" ]; then
            expected="windows linux darwin"
          else
            expected="windows"
          fi
          for target in $expected; do
            if ls dist/*"$target"* >/dev/null 2>&1; then
              echo "  $target: present"
            else
              echo "::warning::$target produced no artefact and is missing here"
            fi
          done
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Generate the SBOM for this release
        run: |
          python3 -m pip install --quiet --upgrade pip
          cargo install cargo-cyclonedx --locked --version 0.5.9
          python3 sbom/generate.py
          cp sbom/*.cdx.json sbom/*.cdx.xml dist/

      - name: Extract this version's changelog section
        id: notes
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.changelog_version }}"
          # Everything between this version's heading and the next one.
          # `index` rather than a regex: escaping a literal '[' through YAML,
          # the shell and awk turns it into a character class, which silently
          # matches nothing and produces an empty release body.
          awk -v v="## [$version]" '
            index($0, v) == 1 { on = 1; next }
            on && index($0, "## [") == 1 { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          {
            echo ""
            echo "---"
            echo ""
            echo "### Verifying this download"
            echo ""
            echo '```bash'
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo "gh attestation verify <file> --repo ${{ github.repository }}"
            echo '```'
            echo ""
            echo "A CycloneDX 1.5 SBOM for this build is attached."
            echo ""
            echo "superbackup fetches the \`kopia\` binary on first run and verifies"
            echo "its SHA-256 against the checksum file Kopia publishes. That proves"
            echo "integrity, not authenticity — see"
            echo "[A8 in the threat model](docs/compliance/THREAT_MODEL.md)."
          } >> notes.md
          cat notes.md

      - name: Open the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: superbackup ${{ needs.preflight.outputs.version }}
          body_path: notes.md
          # Never publish automatically. A human presses the button.
          draft: true
          prerelease: ${{ startsWith(needs.preflight.outputs.version, '0.') || contains(needs.preflight.outputs.version, '-') }}
          files: dist/*
          fail_on_unmatched_files: true
