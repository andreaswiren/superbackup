name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
# Deliberately no `RUSTFLAGS: -D warnings` here.
#
# Set at the workflow level it applies to *dependencies* as well as to this
# workspace, so a warning in any one of six hundred crates — including ones
# introduced by a new compiler release nobody here chose — turns the whole
# matrix red for something nobody can fix. That is what had CI failing on all
# three operating systems while `cargo clippy` was clean locally.
#
# The lint gate belongs on the lint step, where `--` applies it to the crates
# being linted and not to what they depend on.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the priority platform, Linux second, macOS third.
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux GUI and secret-service dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libdbus-1-dev pkg-config
          sudo apt-get install -y libayatana-appindicator3-dev \
            || sudo apt-get install -y libappindicator3-dev

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Clippy, with its findings turned into annotations.
      #
      # The output of a failing step lives in the run's log, and the Actions
      # log API refuses without admin rights on the repository — so a lint that
      # fires only on Linux or only on macOS was, from any other machine, a red
      # tick and the words "exit code 101". Annotations are readable without
      # that, so the diagnostics go there as well as into the log.
      #
      # This matters because it is exactly the class of failure nobody can
      # reproduce: the development machine here is Windows, and the Linux and
      # macOS branches are compiled by this workflow and by nothing else.
      - name: Clippy
        shell: bash
        run: |
          set -o pipefail
          if cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 \
            | tee clippy.log; then
            exit 0
          fi
          echo "--- clippy said: ---"
          # The diagnostic lines only: one annotation per finding, not per line
          # of the surrounding source, and capped so a hundred instances of one
          # lint do not bury the other three.
          grep -E '^(error|warning)(\[|:)' clippy.log | head -40 | while IFS= read -r line; do
            echo "::error title=clippy (${{ matrix.os }})::${line}"
          done
          exit 1

      - name: Test
        run: cargo test --workspace --all-features

      - name: Build release binary
        run: cargo build --workspace --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: superbackup-${{ matrix.os }}
          path: |
            target/release/superbackup
            target/release/superbackup.exe
          if-no-files-found: warn
          retention-days: 14

  audit:
    name: security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Fails the build on a known vulnerability, an unmaintained crate, a
      # licence outside our allowlist, or a source we do not trust. A backup
      # tool that holds every repository key does not get to be casual about
      # its dependency tree.
      #
      # The prebuilt binary rather than `cargo install`, which compiles it from
      # source for a check that runs in seconds.
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libdbus-1-dev pkg-config
          sudo apt-get install -y libayatana-appindicator3-dev \
            || sudo apt-get install -y libappindicator3-dev
      - run: cargo check --workspace --all-features
