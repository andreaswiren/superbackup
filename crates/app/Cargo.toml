[package]
name = "superbackup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Tray-native backup manager for developer machines, powered by Kopia."

[[bin]]
name = "superbackup"
path = "src/main.rs"

[dependencies]
superbackup-core = { path = "../core", version = "0.2.1" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
uuid.workspace = true
eframe = "0.31.1"
egui = "0.31.1"
egui_extras = { version = "0.31.1", features = ["image"] }
tray-icon = "0.24.2"
clap = { version = "4.5.61", features = ["derive", "env"] }
rfd = "0.17.2"
image = { version = "0.25.6", default-features = false, features = ["png"] }
resvg = "0.45.1"
tiny-skia = "0.12.0"
usvg = "0.45.1"
open = "5.4.2"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "async-secret-service", "crypto-rust", "tokio"] }

[build-dependencies]
winresource = "0.1.31"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_Security", "Win32_UI_WindowsAndMessaging"] }
