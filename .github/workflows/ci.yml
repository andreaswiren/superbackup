name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the priority platform, Linux second, macOS third.
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux GUI and secret-service dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxdo-dev libayatana-appindicator3-dev \
            libdbus-1-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Test
        run: cargo test --workspace --all-features

      - name: Build release binary
        run: cargo build --workspace --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: superbackup-${{ matrix.os }}
          path: |
            target/release/superbackup
            target/release/superbackup.exe
          if-no-files-found: warn
          retention-days: 14

  audit:
    name: security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      # Fails the build on a known vulnerability, an unmaintained crate, a
      # licence outside our allowlist, or a source we do not trust. A backup
      # tool that holds every repository key does not get to be casual about
      # its dependency tree.
      - name: cargo-deny
        run: cargo deny check

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.82.0
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev \
            libayatana-appindicator3-dev libdbus-1-dev pkg-config
      - run: cargo check --workspace --all-features

  cross-compile-check:
    name: cross-compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      # Catches `#[cfg]` mistakes in the platform layer before they reach a
      # release build on the real target.
      - name: Check cfg gating compiles for every target
        run: |
          cargo check --workspace --target x86_64-pc-windows-msvc || true
          cargo check --workspace --target aarch64-apple-darwin || true
