<!doctype html><meta charset="utf-8">
<style>
 body{background:#0c0e12;color:#E8ECF2;font:13px/1.4 system-ui,sans-serif;margin:0;padding:14px}
 .row{display:flex;align-items:center;gap:14px;margin:0 0 12px;padding:0 0 10px;border-bottom:1px solid #262b34}
 .lab{width:104px;font-weight:600;font-size:11px}
 .cell{display:flex;flex-direction:column;align-items:center;gap:3px;color:#8A94A1;font-size:9px}
 .lt{background:#F3F3F3;padding:5px;border-radius:4px}
 .ph{background:linear-gradient(120deg,#7a5c3a,#2e6b8a 40%,#b0483c 70%,#4a7a3f);padding:5px;border-radius:4px}
</style>
<body><div id="out"></div>
<script>
// tile helper on 64 grid
function tiles(id,{T,S,K,R,cols,tab,n}){
  const ext=T+(n-1)*S, p=(64-ext)/2;
  let out="", defs="";
  for(let i=0;i<n;i++){
    const x=p+i*S,y=p+i*S;
    // mask: knock out every later tile expanded by K
    let m=`<mask id="m${id}_${i}"><rect width="64" height="64" fill="#fff"/>`;
    for(let j=i+1;j<n;j++){const xx=p+j*S-K, s=T+2*K;
      m+=`<rect x="${xx}" y="${xx}" width="${s}" height="${s}" rx="${R+K}" fill="#000"/>`;}
    m+=`</mask>`; defs+=m;
    let shape;
    if(i===0&&tab){
      const t=T*0.22;
      shape=`<path d="M${x} ${y+t+R*0.55} a${R} ${R} 0 0 1 ${R} -${R} h${T*0.30} l${T*0.13} ${t} h${T*0.57-R} a${R} ${R} 0 0 1 ${R} ${R} v${T-t-R-R*0.55+ (t)} a${R} ${R} 0 0 1 -${R} ${R} h-${T-2*R} a${R} ${R} 0 0 1 -${R} -${R} z" fill="${cols[i]}"/>`;
      shape=`<path d="M${x} ${y+t} a${R*0.8} ${R*0.8} 0 0 1 ${R*0.8} -${R*0.8} h${T*0.28} l${T*0.14} ${t} h${T*0.58-R} a${R} ${R} 0 0 1 ${R} ${R} v${T-t-2*R} a${R} ${R} 0 0 1 -${R} ${R} h-${T-2*R} a${R} ${R} 0 0 1 -${R} -${R} z" fill="${cols[i]}"/>`;
    } else {
      shape=`<rect x="${x}" y="${y}" width="${T}" height="${T}" rx="${R}" fill="${cols[i]}"/>`;
    }
    out+=`<g mask="url(#m${id}_${i})">${shape}</g>`;
  }
  return `<defs>${defs}</defs>${out}`;
}
const W="#F2F5FA", LB="#A8C8FF", AC="#5B9BFF", G="#98A2B3";
const marks={
 "S1 ramp3":       id=>tiles(id,{T:26,S:10.5,K:3.2,R:7.5,n:3,cols:[W,LB,AC]}),
 "S2 ramp3 tab":   id=>tiles(id,{T:26,S:10.5,K:3.2,R:7.5,n:3,tab:1,cols:[W,LB,AC]}),
 "S3 rev ramp":    id=>tiles(id,{T:26,S:10.5,K:3.2,R:7.5,n:3,cols:[AC,LB,W]}),
 "S4 white+acc":   id=>tiles(id,{T:26,S:10.5,K:3.2,R:7.5,n:3,cols:[W,W,AC]}),
 "S5 two tile":    id=>tiles(id,{T:30,S:14,K:4,R:8.5,n:2,cols:[W,AC]}),
 "S6 two tile tab":id=>tiles(id,{T:30,S:14,K:4,R:8.5,n:2,tab:1,cols:[W,AC]}),
 "S7 ramp3 big":   id=>tiles(id,{T:28,S:12,K:3.6,R:8,n:3,cols:[W,LB,AC]}),
};
function plate(inner,size,filter){
 return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" ${filter?'style="filter:'+filter+'"':''}>
  <rect width="64" height="64" rx="14" fill="#1A202A"/>
  <rect x="0.6" y="0.6" width="62.8" height="62.8" rx="13.6" fill="none" stroke="#333C4B" stroke-width="1.2"/>${inner}</svg>`;}
const sizes=[128,48,32,24,20,16];
let html="",i=0;
for(const [n,fn] of Object.entries(marks)){i++;const inner=fn(i);
 html+=`<div class="row"><div class="lab">${n}</div>`+
  sizes.map(s=>`<div class="cell">${plate(inner,s)}<span>${s}</span></div>`).join("")+
  `<div class="cell"><div class="lt">${plate(inner,32)}</div><span>lt32</span></div>`+
  `<div class="cell"><div class="lt">${plate(inner,16)}</div><span>lt16</span></div>`+
  `<div class="cell"><div class="ph">${plate(inner,32)}</div><span>busy</span></div>`+
  `<div class="cell">${plate(inner,44,"grayscale(1)")}<span>grey</span></div></div>`;}
document.getElementById("out").innerHTML=html;
</script>
