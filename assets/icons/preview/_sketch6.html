<!doctype html><meta charset="utf-8">
<style>
 body{background:#0c0e12;color:#E8ECF2;font:13px/1.4 system-ui,sans-serif;margin:0;padding:14px}
 .row{display:flex;align-items:center;gap:14px;margin:0 0 12px;padding:0 0 10px;border-bottom:1px solid #262b34}
 .lab{width:104px;font-weight:600;font-size:11px}
 .cell{display:flex;flex-direction:column;align-items:center;gap:3px;color:#8A94A1;font-size:9px}
 .lt{background:#F3F3F3;padding:5px;border-radius:4px}
 .ph{background:linear-gradient(120deg,#7a5c3a,#2e6b8a 40%,#b0483c 70%,#4a7a3f);padding:5px;border-radius:4px}
</style>
<body><div id="out"></div>
<script>
const W="#F2F5FA", AC="#5B9BFF", LB="#A8C8FF";
const marks={
"T1 bite+block": id=>`
 <defs><mask id="t1${id}"><rect width="64" height="64" fill="#fff"/><rect x="29" y="29" width="32" height="32" rx="11" fill="#000"/></mask></defs>
 <rect x="8" y="8" width="38" height="38" rx="10.5" fill="${W}" mask="url(#t1${id})"/>
 <rect x="33" y="33" width="23" height="23" rx="7" fill="${AC}"/>`,

"T2 detached": id=>`
 <defs><mask id="t2${id}"><rect width="64" height="64" fill="#fff"/><rect x="32" y="32" width="30" height="30" rx="11" fill="#000"/></mask></defs>
 <rect x="7" y="7" width="37" height="37" rx="10.5" fill="${W}" mask="url(#t2${id})"/>
 <rect x="36" y="36" width="21" height="21" rx="6.5" fill="${AC}"/>`,

"T3 stair2": id=>`
 <defs><clipPath id="t3${id}"><rect x="8" y="8" width="48" height="48" rx="13"/></clipPath></defs>
 <g clip-path="url(#t3${id})">
  <rect x="8" y="8" width="48" height="48" fill="${W}"/>
  <path d="M8 32 h16 v16 h16 v16 h-32 z M24 48 h16 v16" fill="none"/>
  <path d="M4 60 V34 h18 V18 h18 V4 h20 v60 z" fill="${AC}"/>
  <path d="M4 60 V34 h18 V18 h18 V4 h20 v60 z" fill="none" stroke="#1A202A" stroke-width="3.4"/>
 </g>`,

"T4 stair3": id=>`
 <defs><clipPath id="t4${id}"><rect x="8" y="8" width="48" height="48" rx="13"/></clipPath></defs>
 <g clip-path="url(#t4${id})">
  <rect x="8" y="8" width="48" height="48" fill="${W}"/>
  <path d="M4 62 V44 h13 V31 h13 V18 h13 V4 h21 v58 z" fill="${AC}"/>
  <path d="M4 62 V44 h13 V31 h13 V18 h13 V4 h21 v58 z" fill="none" stroke="#1A202A" stroke-width="3"/>
 </g>`,

"T5 stepnotch": id=>`
 <defs><mask id="t5${id}"><rect width="64" height="64" fill="#fff"/>
  <path d="M33 33 h30 v30 h-30 z" fill="#000"/><path d="M44 20 h20 v20 h-20 z" fill="#000"/></mask></defs>
 <rect x="8" y="8" width="40" height="40" rx="11" fill="${W}" mask="url(#t5${id})"/>
 <rect x="37" y="37" width="20" height="20" rx="6" fill="${AC}"/>`,

"T6 bite+2block": id=>`
 <defs><mask id="t6${id}"><rect width="64" height="64" fill="#fff"/>
   <rect x="27" y="27" width="28" height="28" rx="10" fill="#000"/>
   <rect x="41" y="41" width="24" height="24" rx="9" fill="#000"/></mask>
  <mask id="t6b${id}"><rect width="64" height="64" fill="#fff"/><rect x="41" y="41" width="24" height="24" rx="9" fill="#000"/></mask></defs>
 <rect x="7" y="7" width="35" height="35" rx="10" fill="${W}" mask="url(#t6${id})"/>
 <rect x="31" y="31" width="20" height="20" rx="6" fill="${LB}" mask="url(#t6b${id})"/>
 <rect x="45" y="45" width="13" height="13" rx="4.2" fill="${AC}"/>`,
};
function plate(inner,size,filter){
 return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" ${filter?'style="filter:'+filter+'"':''}>
  <rect width="64" height="64" rx="14" fill="#1A202A"/>
  <rect x="0.6" y="0.6" width="62.8" height="62.8" rx="13.6" fill="none" stroke="#333C4B" stroke-width="1.2"/>${inner}</svg>`;}
const sizes=[128,48,32,24,20,16];
let html="",i=0;
for(const [n,fn] of Object.entries(marks)){i++;const inner=fn(i);
 html+=`<div class="row"><div class="lab">${n}</div>`+
  sizes.map(s=>`<div class="cell">${plate(inner,s)}<span>${s}</span></div>`).join("")+
  `<div class="cell"><div class="lt">${plate(inner,32)}</div><span>lt32</span></div>`+
  `<div class="cell"><div class="lt">${plate(inner,16)}</div><span>lt16</span></div>`+
  `<div class="cell"><div class="ph">${plate(inner,32)}</div><span>busy</span></div>`+
  `<div class="cell">${plate(inner,44,"grayscale(1)")}<span>grey</span></div></div>`;}
document.getElementById("out").innerHTML=html;
</script>
