<!doctype html><meta charset="utf-8">
<style>
 body{background:#0c0e12;color:#E8ECF2;font:13px/1.4 system-ui,sans-serif;margin:0;padding:16px}
 .row{display:flex;align-items:center;gap:16px;margin:0 0 16px;padding:0 0 12px;border-bottom:1px solid #262b34}
 .lab{width:100px;font-weight:600;font-size:12px}
 .cell{display:flex;flex-direction:column;align-items:center;gap:4px;color:#8A94A1;font-size:10px}
 .lt{background:#F3F3F3;padding:5px;border-radius:4px}
</style>
<body><div id="out"></div>
<script>
const ink="#E8ECF2", acc="#5B9BFF", mid="#8B93A5", dim="#5A6472";
const marks={
"P1 bite+block": id=>`
 <defs><mask id="p1${id}"><rect width="64" height="64" fill="#fff"/>
  <rect x="30" y="30" width="30" height="30" rx="10" fill="#000"/></mask></defs>
 <rect x="9" y="9" width="38" height="38" rx="10" fill="${ink}" mask="url(#p1${id})"/>
 <rect x="34" y="34" width="21" height="21" rx="6" fill="${acc}"/>`,

"P2 bite+2blocks": id=>`
 <defs><mask id="p2${id}"><rect width="64" height="64" fill="#fff"/>
  <rect x="26" y="26" width="34" height="34" rx="10" fill="#000"/>
  <rect x="38" y="38" width="24" height="24" rx="8" fill="#000"/></mask>
  <mask id="p2b${id}"><rect width="64" height="64" fill="#fff"/>
  <rect x="38" y="38" width="24" height="24" rx="8" fill="#000"/></mask></defs>
 <rect x="7" y="7" width="36" height="36" rx="10" fill="${ink}" mask="url(#p2${id})"/>
 <rect x="30" y="30" width="17" height="17" rx="5" fill="${mid}" mask="url(#p2b${id})"/>
 <rect x="42" y="42" width="14" height="14" rx="4.4" fill="${acc}"/>`,

"P3 brackets": id=>`
 <path d="M11 28 V18 a6 6 0 0 1 6-6 h10" fill="none" stroke="${dim}" stroke-width="5.5" stroke-linecap="round"/>
 <path d="M21 35 V25 a6 6 0 0 1 6-6 h10" fill="none" stroke="${mid}" stroke-width="5.5" stroke-linecap="round"/>
 <rect x="29" y="27" width="25" height="25" rx="7" fill="${acc}"/>`,

"P4 two tiles": id=>`
 <defs><mask id="p4${id}"><rect width="64" height="64" fill="#fff"/>
  <rect x="26" y="26" width="34" height="34" rx="11" fill="#000"/></mask></defs>
 <rect x="8" y="8" width="30" height="30" rx="8" fill="${ink}" mask="url(#p4${id})"/>
 <rect x="30" y="30" width="26" height="26" rx="7" fill="${acc}"/>`,

"P5 bite+block acc-tile": id=>`
 <defs><mask id="p5${id}"><rect width="64" height="64" fill="#fff"/>
  <rect x="30" y="30" width="30" height="30" rx="10" fill="#000"/></mask></defs>
 <rect x="9" y="9" width="38" height="38" rx="10" fill="${acc}" mask="url(#p5${id})"/>
 <rect x="34" y="34" width="21" height="21" rx="6" fill="${ink}"/>`,

"P6 bite+strata": id=>`
 <defs><mask id="p6${id}"><rect width="64" height="64" fill="#fff"/>
  <rect x="30" y="30" width="30" height="30" rx="10" fill="#000"/>
  <rect x="5" y="21.5" width="45" height="4" fill="#000"/>
  <rect x="5" y="32.5" width="45" height="4" fill="#000"/></mask></defs>
 <rect x="9" y="9" width="38" height="38" rx="10" fill="${ink}" mask="url(#p6${id})"/>
 <rect x="34" y="34" width="21" height="21" rx="6" fill="${acc}"/>`,
};
function plate(inner,size,bg,filter){
 return `<svg width="${size}" height="${size}" viewBox="0 0 64 64" ${filter?'style="filter:'+filter+'"':''}>
  <rect width="64" height="64" rx="14" fill="${bg||'#181D26'}"/>${inner}</svg>`;}
const sizes=[96,48,32,24,16];
let html="",i=0;
for(const [n,fn] of Object.entries(marks)){i++;const inner=fn(i);
 html+=`<div class="row"><div class="lab">${n}</div>`+
  sizes.map(s=>`<div class="cell">${plate(inner,s)}<span>${s}</span></div>`).join("")+
  `<div class="cell"><div class="lt">${plate(inner,32)}</div><span>lt32</span></div>`+
  `<div class="cell"><div class="lt">${plate(inner,16)}</div><span>lt16</span></div>`+
  `<div class="cell">${plate(inner,40,null,"grayscale(1)")}<span>grey</span></div>`+
  `<div class="cell">${plate(inner,40,"#000","brightness(0) invert(1)")}<span>sil</span></div></div>`;}
document.getElementById("out").innerHTML=html;
</script>
